<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Kasi</title>
<style>
:root{
  --bg:#0A0A0A;--card:#141414;--card2:#1C1C1C;--hover:#242424;
  --line:rgba(212,175,55,.12);--line2:rgba(212,175,55,.28);
  --text:#F3EBD0;--muted:#8A8577;--muted2:#5c5850;
  --gold:#D4AF37;--gold2:#e5c66a;--gold3:#a8871e;
  --glow:rgba(212,175,55,.3);--live:#2A9D8F;--danger:#8B2635;--gray:#2a2a2a;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select{font:inherit}
svg{display:block}

#app{height:100dvh;display:grid;grid-template-rows:52px 1fr 62px}
@media(min-width:900px){#app{grid-template-rows:56px 1fr 88px;padding:12px;gap:12px}}

header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
@media(min-width:900px){header{border-radius:14px;border:1px solid var(--line);padding:0 20px}}
.ibtn{width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex-shrink:0;transition:all .14s}
.ibtn:hover{background:var(--hover);color:var(--text)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.3px}
.logo em{color:var(--gold);font-style:normal}
.search-wrap{flex:1;max-width:420px;display:flex;align-items:center;gap:6px;min-width:0}
.search{flex:1;padding:9px 16px;background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--text);outline:none;font-size:14px;min-width:0}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.search::placeholder{color:var(--muted2)}
.scope{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;outline:none}
.spacer{flex:1}
.live{display:none;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--live);padding:4px 10px;border:1px solid var(--live);border-radius:999px}
.live.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(min-width:600px){.live{display:inline-flex}}
.who{display:none;font-size:12px;color:var(--muted)}
@media(min-width:700px){.who{display:inline}}

main{display:grid;grid-template-columns:1fr;overflow:hidden;min-height:0}
@media(min-width:900px){main{grid-template-columns:250px 1fr;gap:12px}}

aside{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;overflow-y:auto}
@media(min-width:900px){aside{display:block}}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted2);margin:18px 12px 8px;font-weight:600}
.side-label:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all .14s;position:relative}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.active{background:var(--card2);color:var(--gold);font-weight:600;border-color:var(--line2)}
.nav.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:0 3px 3px 0;box-shadow:0 0 10px var(--glow)}
.nav svg{flex-shrink:0;opacity:.85}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;flex-shrink:0}
.badge{margin-left:auto;background:var(--bg);color:var(--muted);font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.nav .del{margin-left:auto;color:var(--muted);font-size:16px;padding:0 4px;opacity:0}
.nav:hover .del{opacity:1}

section.content{overflow-y:auto;padding:20px 16px 24px;background:var(--bg)}
@media(min-width:900px){section.content{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 30px 40px}}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:22px}
@media(min-width:900px){.head{flex-direction:row;align-items:flex-end;gap:14px;margin-bottom:28px;flex-wrap:wrap}}
.head h2{font-size:26px;font-weight:700;letter-spacing:-.6px;background:linear-gradient(135deg,var(--text) 30%,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(min-width:900px){.head h2{font-size:32px}}
.head .sub{color:var(--muted);font-size:12.5px}
.head .actions{display:flex;gap:8px;width:100%;margin-top:6px;flex-wrap:wrap}
@media(min-width:900px){.head .actions{margin-left:auto;width:auto;margin-top:0;padding-bottom:6px}}
.btn2{flex:1;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;font-weight:700;font-size:12.5px;box-shadow:0 3px 14px var(--glow);text-align:center;transition:all .16s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn2.ghost{background:var(--bg);color:var(--muted);border:1px solid var(--line);box-shadow:none;font-weight:500}
@media(min-width:900px){.btn2{flex:none}}

/* ═══════════ HOME ═══════════ */
.home-section{margin-bottom:32px}
.home-section:last-child{margin-bottom:0}

.home-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.home-head h3{
  font-size:18px;font-weight:700;letter-spacing:-.3px;
  margin:0;
}
.home-head .see-all{
  font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;transition:color .14s;
  padding:4px 8px;border-radius:6px;
}
.home-head .see-all:hover{color:var(--gold);background:var(--hover)}

/* horizontal playlist scroller */
.pl-scroller{
  display:flex;gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:4px 4px 12px;
  margin:-4px -4px 0;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pl-scroller::-webkit-scrollbar{display:none}

.pl-tile{
  flex-shrink:0;
  width:170px;
  padding:14px;
  border-radius:14px;
  background:var(--card2);
  border:1px solid var(--line);
  cursor:pointer;
  transition:all .18s;
  scroll-snap-align:start;
}
.pl-tile:hover{
  background:var(--hover);
  border-color:var(--line2);
  transform:translateY(-3px);
}
.pl-tile .cover{
  width:100%;aspect-ratio:1;
  border-radius:10px;overflow:hidden;
  background:var(--gray);
  margin-bottom:12px;
  position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.pl-tile .cover img{width:100%;height:100%;object-fit:cover;display:block}
.pl-tile .cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.5));
  pointer-events:none;
}
.pl-tile .pl-play{
  position:absolute;bottom:8px;right:8px;
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  color:#0A0A0A;
  display:grid;place-items:center;
  box-shadow:0 4px 14px var(--glow);
  opacity:0;transform:translateY(6px);
  transition:all .2s;
  z-index:2;
}
.pl-tile:hover .pl-play{opacity:1;transform:translateY(0)}
.pl-tile .pl-play svg{width:14px;height:14px}
.pl-tile h4{
  margin:0 0 3px;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-tile .meta{
  font-size:11.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-tile .pl-badge{
  display:inline-block;margin-left:6px;font-size:9px;
  padding:1px 5px;border-radius:4px;
  background:rgba(42,157,143,.15);
  color:var(--live);border:1px solid var(--live);
  letter-spacing:.4px;font-weight:600;text-transform:uppercase;
}

/* genre grid */
.genre-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
@media(min-width:600px){.genre-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.genre-grid{grid-template-columns:repeat(4,1fr)}}

.genre-tile{
  position:relative;
  aspect-ratio:1.6;
  border-radius:14px;
  padding:16px;
  cursor:pointer;
  overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:all .2s;
  border:1px solid rgba(255,255,255,.04);
  isolation:isolate;
}
.genre-tile:hover{transform:translateY(-3px)}
.genre-tile::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(135deg,rgba(0,0,0,.1),rgba(0,0,0,.55));
  transition:opacity .2s;
}
.genre-tile:hover::after{opacity:.7}
.genre-tile .g-name{
  font-size:16px;font-weight:700;letter-spacing:-.3px;
  line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.genre-tile .g-count{
  font-size:11px;color:rgba(255,255,255,.7);
  letter-spacing:.5px;text-transform:uppercase;font-weight:600;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.genre-tile .g-art{
  position:absolute;right:-12px;bottom:-12px;
  width:72px;height:72px;
  border-radius:8px;overflow:hidden;
  transform:rotate(25deg);
  box-shadow:0 6px 20px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.08);
  opacity:.9;
}
.genre-tile .g-art img{width:100%;height:100%;object-fit:cover;display:block}

/* tracks list (still used in genre/playlist views) */
.row{display:grid;grid-template-columns:22px 46px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;transition:background .12s;border:1px solid transparent}
@media(min-width:900px){.row{grid-template-columns:32px 48px 1fr 180px 60px 96px;gap:14px;padding:8px 14px}}
.row:hover{background:var(--hover)}
.row.playing{background:var(--card2);border-color:var(--line2)}
.row.playing .title{color:var(--gold)}
.idx{color:var(--muted);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.cover-sm{width:46px;height:46px;border-radius:6px;background:var(--gray);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.04)}
@media(min-width:900px){.cover-sm{width:48px;height:48px}}
.cover-sm img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.35);transition:filter .2s}
.row:hover .cover-sm img{filter:grayscale(0)}
.row.playing .cover-sm img{filter:grayscale(0)}
.bars{position:absolute;left:6px;bottom:6px;display:flex;gap:2px;align-items:flex-end;height:12px;z-index:2}
.bars i{display:block;width:2px;background:var(--gold);animation:bar 1s ease-in-out infinite;border-radius:1px}
.bars i:nth-child(1){height:4px;animation-delay:0s}
.bars i:nth-child(2){height:9px;animation-delay:.15s}
.bars i:nth-child(3){height:6px;animation-delay:.3s}
.bars i:nth-child(4){height:10px;animation-delay:.45s}
@keyframes bar{0%,100%{height:3px}50%{height:11px}}

.title{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.artist{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album,.time{display:none;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{text-align:right;font-variant-numeric:tabular-nums}
@media(min-width:900px){.album{display:block}.time{display:block}}
.acts{display:flex;gap:4px}
.ibtn-sm{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted);border:1.5px solid var(--gray);background:transparent;transition:all .14s}
.ibtn-sm svg{width:13px;height:13px}
.ibtn-sm:hover{border-color:var(--gold);color:var(--gold)}
.ibtn-sm.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));border-color:var(--gold);color:#0A0A0A}

.storage{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

footer{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-top:1px solid var(--line);position:relative;cursor:pointer}
@media(min-width:900px){footer{grid-template-columns:1fr auto 1fr;border:1px solid var(--line);border-radius:14px;padding:0 20px;gap:18px}}
#miniProgress{position:absolute;top:-1px;left:0;right:0;height:2px;background:rgba(212,175,55,.08);overflow:hidden;pointer-events:none}
#miniProgress > div{height:100%;width:0;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold));box-shadow:0 0 8px var(--glow);transition:width .3s linear}
.mini-art{width:42px;height:42px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--gray);position:relative;border:1px solid rgba(255,255,255,.06)}
.mini-art img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:900px){.mini-art{display:none}}
footer .info{min-width:0;overflow:hidden}
.np-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;flex-shrink:0;box-shadow:0 3px 14px var(--glow);transition:transform .14s}
.play svg{width:16px;height:16px}
.play:active{transform:scale(.94)}
.desk{display:none}
@media(min-width:900px){.desk{display:flex}}
.ctrls{display:flex;align-items:center;gap:14px;justify-content:center}
.ctrls button{color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:color .14s;position:relative}
.ctrls button:hover{color:var(--gold)}
.ctrls button.on{color:var(--gold)}
.ctrls button.on::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.ctrls .play{width:44px;height:44px}
.ctrls .play svg{width:18px;height:18px}
.seek{display:flex;align-items:center;gap:10px;margin-top:8px;min-width:340px}
.seek span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:36px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;background:var(--bg);outline:none;cursor:pointer;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 2px 8px var(--glow)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--gold)}
.vol{display:flex;align-items:center;gap:10px;justify-content:flex-end;color:var(--muted)}
.vol input{max-width:110px}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);z-index:401;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,0,0,1);box-shadow:0 0 60px rgba(0,0,0,.7)}
#drawer.open{transform:translateX(0)}
@media(min-width:900px){#drawer,#backdrop{display:none}}
.drawer-head{display:flex;align-items:center;gap:10px;padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.drawer-head .logo{font-size:16px}
.drawer-head .who2{margin-left:auto;font-size:11.5px;color:var(--muted)}

#tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);height:62px;background:var(--card);border-top:1px solid var(--line);z-index:300;padding-bottom:env(safe-area-inset-bottom,0)}
@media(min-width:900px){#tabs{display:none}}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:color .14s}
#tabs button svg{width:20px;height:20px}
#tabs button.active{color:var(--gold)}
@media(max-width:899px){section.content{padding-bottom:calc(62px + 70px + 20px)}}

#npscreen{position:fixed;inset:0;z-index:500;background:radial-gradient(1200px 800px at 50% -10%,#1a1512 0%,#0A0A0A 60%);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,0,0,1);overflow-y:auto;display:flex;flex-direction:column;align-items:center}
#npscreen.open{transform:translateY(0)}
.np-wrap{width:100%;max-width:520px;padding:20px 24px 32px;display:flex;flex-direction:column;align-items:center}
.np-handle{width:44px;height:4px;border-radius:2px;background:rgba(212,175,55,.35);margin:0 auto 14px;flex-shrink:0}
.np-top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.np-top button{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--text);display:grid;place-items:center}
.np-top .lbl{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.np-art{width:100%;max-width:300px;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--gray);border:1px solid var(--line);box-shadow:0 18px 48px rgba(0,0,0,.7);margin-bottom:28px;position:relative}
.np-art img{width:100%;height:100%;object-fit:cover;display:block}
.np-song{text-align:center;margin-bottom:22px;width:100%}
.np-song .t{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.np-song .a{font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:color .14s}
.np-song .a:hover{color:var(--gold)}
.np-song .a::after{content:"›";font-size:16px;line-height:1}
.np-seek{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:18px}
.np-seek span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:36px;text-align:center}
.np-c{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:24px}
.np-c button{color:var(--muted);width:48px;height:48px;display:grid;place-items:center;border-radius:50%;transition:color .14s}
.np-c button svg{width:22px;height:22px}
.np-c button:hover{color:var(--gold)}
.np-c button.on{color:var(--gold)}
.np-c .pp{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;box-shadow:0 6px 24px var(--glow)}
.np-c .pp svg{width:24px;height:24px}
.np-c .pp:active{transform:scale(.94)}
.np-sec{display:flex;justify-content:space-between;width:100%;max-width:340px;margin-bottom:24px}
.np-sec button{color:var(--muted);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:color .14s}
.np-sec button svg{width:18px;height:18px}
.np-sec button.on{color:var(--gold)}

.more-artist{width:100%;border-top:1px solid var(--line);padding-top:22px}
.more-artist .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.more-artist .mh h4{margin:0;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted2)}
.more-artist .mh span{font-size:11.5px;color:var(--muted)}
.artist-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.artist-chip img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.artist-chip .an{font-weight:600;font-size:14px}
.artist-chip .as{color:var(--muted);font-size:11.5px;margin-top:2px}
.more-row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .12s}
.more-row:hover{background:var(--hover)}
.more-row.playing{background:var(--card2);border-color:var(--line2)}
.more-row.playing .mr-title{color:var(--gold)}
.more-row .mr-cover{width:46px;height:46px;border-radius:6px;overflow:hidden;background:var(--gray);border:1px solid rgba(255,255,255,.04);position:relative}
.more-row .mr-cover img{width:100%;height:100%;object-fit:cover;display:block}
.more-row .mr-title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-row .mr-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-row .mr-dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.more-row .mr-play{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;display:grid;place-items:center;box-shadow:0 2px 10px var(--glow);opacity:0;transition:opacity .14s}
.more-row:hover .mr-play{opacity:1}
.more-row.playing .mr-play{opacity:1}
.more-row .mr-play svg{width:12px;height:12px}

#study{position:fixed;inset:0;z-index:600;background:rgba(10,9,8,.98);backdrop-filter:blur(20px);display:none;place-items:center;padding:24px}
#study.open{display:grid}
.study-box{text-align:center;max-width:420px;width:100%}
.study-timer{font-size:96px;font-weight:200;letter-spacing:-4px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--text) 0%,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.study-lbl{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.study-trk{font-size:15px;margin-bottom:6px}
.study-art{font-size:13px;color:var(--muted);margin-bottom:32px}
.study-c{display:flex;gap:16px;justify-content:center;align-items:center;margin-bottom:28px}
.study-c button{color:var(--muted);width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.study-c button svg{width:20px;height:20px}
.study-pp{width:64px !important;height:64px !important;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A !important;box-shadow:0 6px 24px var(--glow)}
.study-pp svg{width:22px;height:22px}
.study-dur{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.study-dur button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px;transition:all .16s}
.study-dur button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;border-color:transparent;box-shadow:0 3px 14px var(--glow)}
.study-exit{position:absolute;top:24px;right:24px;color:var(--muted);font-size:13px;padding:8px 16px;border:1px solid var(--line);border-radius:999px}

#queue{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);z-index:450;background:var(--card);border-left:1px solid var(--line);padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,0,0,1);box-shadow:-20px 0 60px rgba(0,0,0,.7)}
#queue.open{transform:translateX(0)}
#queue .q-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
#queue .q-head button{color:var(--muted);font-size:20px}
.q-item{display:grid;grid-template-columns:20px 34px 1fr;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:13px;align-items:center}
.q-item:hover{background:var(--hover);border-color:var(--line)}
.q-item.current{background:var(--card2);border-color:var(--line2)}
.q-item.current .q-t{color:var(--gold)}
.q-item .q-thumb{width:34px;height:34px;border-radius:5px;overflow:hidden;background:var(--gray)}
.q-item .q-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.q-num{color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.q-t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.q-a{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toast{position:fixed;bottom:calc(62px + 70px + 16px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:10px 18px;border-radius:999px;font-size:12.5px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
@media(min-width:900px){#toast{bottom:110px}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#login{position:fixed;inset:0;z-index:800;background:radial-gradient(900px 600px at 50% -10%,#1a1512 0%,#0A0A0A 60%);display:grid;place-items:center;padding:24px}
#login.off{display:none}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 18px 48px rgba(0,0,0,.7);position:relative}
.login-card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(212,175,55,.45),transparent 35%,transparent 65%,rgba(212,175,55,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.login-mark{display:flex;justify-content:center;margin-bottom:18px}
.login-card h1{text-align:center;font-size:26px;font-weight:800;margin-bottom:6px}
.login-card h1 em{color:var(--gold);font-style:normal}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.f{margin-bottom:14px}
.f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.f input{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none;transition:all .18s;font-size:16px}
.f input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.f input::placeholder{color:var(--muted2)}
.login-btn{width:100%;padding:14px;border-radius:999px;margin-top:8px;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0A0A0A;font-weight:700;letter-spacing:.3px;box-shadow:0 4px 18px var(--glow);transition:all .16s}
.switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.switch button{color:var(--gold);font-weight:600;padding:0 4px}
.login-err{color:var(--danger);font-size:12.5px;text-align:center;min-height:18px;margin-top:10px}
input[type=range]:focus{outline:none}

/* ═══════════ RESPONSIVE FIXES ═══════════ */
html, body { max-width: 100%; overflow-x: hidden; }
img { max-width: 100%; }

/* Admin form rows should wrap instead of using the track-list grid */
.row:has(#blockPick){ display:flex; flex-wrap:wrap; }
.row:has(#blockPick) > *{ flex:1 1 180px; min-width:0; }
.row:has(#blockPick) #blockBtn{ flex:0 0 auto; }

/* Phones and small tablets */
@media (max-width: 899px){
  header{ min-height:52px; height:auto; padding:8px 10px; gap:8px; }
  .search-wrap{ max-width:none; }
  .search{ font-size:16px; padding:8px 14px; }   /* 16px stops iOS zooming in */
  .scope{ display:none; }
  .logo{ font-size:14px; }
  .head h2{ font-size:22px; }
  .row{ grid-template-columns:22px 46px 1fr auto; gap:8px; }
  .row .acts{ gap:2px; }
  .ibtn-sm{ width:30px; height:30px; }
  .genre-grid{ grid-template-columns:repeat(2,1fr); }
  .more-row{ grid-template-columns:42px 1fr auto; }
  .seek{ min-width:0; width:100%; }
  .study-timer{ font-size:72px; letter-spacing:-2px; }
  .np-art{ max-width:260px; }
  .np-c{ gap:14px; }
  .np-c .pp{ width:60px; height:60px; }
  .login-card{ padding:24px 20px; }
  .login-card h1{ font-size:22px; }
  .login-mark svg{ width:80px; height:100px; }
  .f input{ font-size:16px; }
}

/* Login screen: allow scrolling so the Sign up link is never cut off */
#login{ overflow-y:auto; place-items:start center; padding:16px; }
.login-card{ margin:auto 0; }
@media (max-height: 700px){
  .login-mark svg{ width:70px; height:88px; }
  .login-card .sub{ margin-bottom:14px; }
}

/* Very narrow phones */
@media (max-width: 360px){
  .row{ grid-template-columns:20px 40px 1fr auto; padding:6px; }
  .cover-sm{ width:40px; height:40px; }
  .genre-grid{ grid-template-columns:1fr 1fr; gap:8px; }
  .btn2{ font-size:12px; padding:9px 12px; }
}

/* Desktop */
@media (min-width: 900px){
  .search{ font-size:14px; }
  .head h2{ font-size:32px; }
  .genre-grid{ grid-template-columns:repeat(4,1fr); }
  section.content, aside{ min-width:0; }
  .row{ grid-template-columns:32px 48px 1fr 180px 60px 96px; }
}

  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 200 250" width="100" height="125">
        <rect width="200" height="250" rx="44" fill="#000"/>
        <g fill="url(#gold)">
          <rect x="36" y="82" width="16" height="36" rx="8"/>
          <rect x="62" y="60" width="16" height="80" rx="8"/>
          <rect x="88" y="44" width="16" height="112" rx="8"/>
          <rect x="114" y="66" width="16" height="68" rx="8"/>
          <rect x="140" y="88" width="16" height="24" rx="8"/>
        </g>
        <text x="100" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="bold" letter-spacing="4" fill="url(#gold)">KASI</text>
      </svg>
    </div>
    <h1>Ka<em>si</em></h1>
    <p class="sub" id="loginSub">Welcome back</p>

    <div class="switch"><span id="switchTxt">No account?</span> <button id="switchBtn">Sign up</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

  /* ═══════════ AUDIO (real files) ═══════════ */
  const Audio = {
    el: new window.Audio(),
    current: null,
    init(){
      this.el.preload = 'auto';
      this.el.volume = 0.6;
      this.el.addEventListener('loadedmetadata', () => {
        const t = state.queue[state.qIndex];
        if (t && t.src === this.current){ t.duration = this.el.duration; updatePlayer(); }
      });
      this.el.addEventListener('ended', () => nextTrack(true));
      this.el.addEventListener('error', () => toast('Could not load this track. Check the music folder.', 4000));
    },
    load(t){
      if (this.current === t.src) return;
      this.current = t.src;
      this.el.src = t.src;
    },
    start(){ const p = this.el.play(); if (p && p.catch) p.catch(() => toast('Tap play to start audio')); },
    stop(){ this.el.pause(); },
    setVolume(v){ this.el.volume = v; },
  };
  Audio.init();

  /* ═══════════ DATA (loaded from Jamendo) ═══════════ */
  const JAMENDO_ID = "ba5c5981";
  // App genre name -> Jamendo tag. Add or change genres here.
  const GENRE_TAGS = {
    'Ambient': 'ambient', 'Lo-Fi': 'lofi', 'Jazz': 'jazz', 'Electronic': 'electronic',
    'Hip-Hop': 'hiphop', 'Pop': 'pop', 'R&B / Love': 'rnb',
    'Chill': 'chillout', 'Rock': 'rock', 'Classical': 'classical',
    'Folk': 'folk', 'Reggae': 'reggae', 'Soul': 'soul',
    'Amapiano': 'afrohouse', 'Afrobeats': 'afrobeat',
    'African': 'african', 'Afropop': 'afropop', 'Highlife': 'highlife', 'Kwaito': 'kwaito', 'Afro Soul': 'afrosoul', 'Gqom': 'gqom'
  };
  const GENRE_COLORS = {
    'Trending':    ['#8B2635', '#5a1823'],
    'Pop':         ['#D4AF37', '#8a6a1e'],
    'Hip-Hop':     ['#2A9D8F', '#16584f'],
    'R&B / Love':  ['#a83256', '#661a34'],
    'Electronic':  ['#2a5a9d', '#14315a'],
    'Lo-Fi':       ['#5a2a7d', '#2f1650'],
    'Ambient':     ['#3a6b5c', '#1c3a31'],
    'Jazz':        ['#8a5a1e', '#4a3010'],
    'Amapiano':    ['#d4743a', '#7a3d1a'],
    'Afrobeats':   ['#c49b1e', '#6a5312'],
    'African': ['#8a6b1e','#4a3510'], 'Afropop': ['#d43a7a','#6a1a3a'], 'Highlife': ['#2a7a9a','#143d4d'], 'Kwaito': ['#9a5a2a','#4d2c15'], 'Afro Soul': ['#7a3a9a','#3a1a4d'], 'Gqom': ['#2a9a6a','#14503a']
  };

  let TRACKS = [];
  let GENRES = [];
  let ALL_TRACKS = [];
  let CATALOG = {};

  // Placeholder cover (gold bars on black) for songs with no cover image
  const DEFAULT_ART = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23F5D76E%22%2F%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%23D4AF37%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%239C7A1E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%230A0A0A%22%2F%3E%3Cg%20fill%3D%22url%28%23g%29%22%3E%3Crect%20x%3D%2236%22%20y%3D%2282%22%20width%3D%2216%22%20height%3D%2236%22%20rx%3D%228%22%2F%3E%3Crect%20x%3D%2262%22%20y%3D%2260%22%20width%3D%2216%22%20height%3D%2280%22%20rx%3D%228%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2244%22%20width%3D%2216%22%20height%3D%22112%22%20rx%3D%228%22%2F%3E%3Crect%20x%3D%22114%22%20y%3D%2266%22%20width%3D%2216%22%20height%3D%2268%22%20rx%3D%228%22%2F%3E%3Crect%20x%3D%22140%22%20y%3D%2288%22%20width%3D%2216%22%20height%3D%2224%22%20rx%3D%228%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E";
  const artURL = () => DEFAULT_ART;
  const artistArtURL = name => (ALL_TRACKS.find(t => t.artist === name) || {}).art || DEFAULT_ART;

  const OFFSET = {};
  async function fetchTag(genre, tag, limit = 20){
    const offset = OFFSET[genre] || 0;
    const url = "https://api.jamendo.com/v3.0/tracks/?client_id=" + JAMENDO_ID +
      "&format=json&limit=" + limit + "&offset=" + offset +
      "&audioformat=mp32&tags=" + encodeURIComponent(tag);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Jamendo " + res.status);
    const data = await res.json();
    OFFSET[genre] = offset + data.results.length;
    return data.results.filter(t => t.audio).map(t => ({
      id: genre + '-' + t.id,
      title: t.name,
      artist: t.artist_name,
      album: t.album_name || '',
      genre: genre,
      art: t.album_image || t.image || DEFAULT_ART,
      src: t.audio,
      duration: t.duration || 0,
      saved: false,
      license: t.license_ccurl || '', download: t.audiodownload || t.audio || ''
    }));
  }

  function rebuildIndex(){
    ALL_TRACKS = TRACKS;
    GENRES = Object.keys(GENRE_TAGS).filter(g => TRACKS.some(t => t.genre === g));
    CATALOG = {};
    GENRES.forEach(g => { CATALOG[g] = TRACKS.filter(t => t.genre === g); });
    const savedIds = loadSavedIds();
    TRACKS.forEach(t => { t.saved = savedIds.has(t.id); });

  }

  /* ═══════════ ADMIN ═══════════ */
  async function checkAdmin(){
    if (!sb) return;
    const { data, error } = await sb.rpc('is_admin');
    state.isAdmin = !error && data === true;
    $('adminBtn').style.display = state.isAdmin ? '' : 'none';
    renderDrawerNav();
  }

  async function applyBlocks(){
    if (!sb) return;
    const { data, error } = await sb.from('blocked_tracks').select('track_id');
    if (error || !data) return;
    const blocked = new Set(data.map(r => r.track_id));
    TRACKS = TRACKS.filter(t => !blocked.has(t.id));
  }

  function renderAdmin(body){
    body.innerHTML = `
      <div class="home-head"><h3>Block a track</h3></div>
      <div class="row">
        <select id="blockPick" style="flex:1"></select>
        <input id="blockReason" placeholder="Reason (optional)" style="flex:1">
        <button class="btn2" id="blockBtn" style="flex:none">Block</button>
      </div>
      <div class="home-head" style="margin-top:28px"><h3>Blocked tracks</h3></div>
      <div id="blockedList" class="muted">Loading…</div>`;

    const pick = body.querySelector('#blockPick');
    ALL_TRACKS.forEach(t => pick.add(new Option(t.title + ' — ' + t.artist, t.id)));

    body.querySelector('#blockBtn').onclick = async () => {
      const t = ALL_TRACKS.find(x => x.id === pick.value);
      if (!t) return toast('No track selected');
      const reason = body.querySelector('#blockReason').value.trim();
      const { error } = await sb.from('blocked_tracks').insert({ track_id: t.id, title: t.title, reason });
      if (error) return toast('Failed: ' + error.message, 4000);
      toast('Blocked "' + t.title + '"');
      TRACKS = TRACKS.filter(x => x.id !== t.id);
      rebuildIndex();
      render();
    };

    loadBlockedList();
  }

  async function loadBlockedList(){
    const box = document.getElementById('blockedList');
    if (!box || !sb) return;
    const { data, error } = await sb.from('blocked_tracks')
      .select('track_id, title, reason, created_at').order('created_at', { ascending: false });
    if (error){ box.textContent = 'Could not load: ' + error.message; return; }
    if (!data.length){ box.textContent = 'No blocked tracks.'; return; }
    box.innerHTML = '';
    data.forEach(r => {
      const row = document.createElement('div');
      row.className = 'topic';
      row.innerHTML = '<span>' + esc(r.title || r.track_id) +
        (r.reason ? ' <span class="muted">— ' + esc(r.reason) + '</span>' : '') + '</span>';
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = 'Unblock';
      btn.onclick = async () => {
        const { error } = await sb.from('blocked_tracks').delete().eq('track_id', r.track_id);
        if (error) return toast('Failed: ' + error.message, 4000);
        toast('Unblocked. It returns after you reload.');
        loadBlockedList();
      };
      row.appendChild(btn);
      box.appendChild(row);
    });
  }

  /* ═════════ UPLOADS (Cloudflare Worker + Supabase) ═════════ */
  const WORKER_URL = "https://kali.petruslifeline.workers.dev";

  function renderUpload(body){
    body.innerHTML = `
      <div class="muted" style="margin-bottom:14px">Only upload music you made or have permission to share. Each upload is listed under your account.</div>
      <div class="f"><label>Song title</label><input id="upTitle" placeholder="Song title"></div>
      <div class="f"><label>Artist</label><input id="upArtist" placeholder="Artist name"></div>
      <div class="f"><label>Album (optional)</label><input id="upAlbum" placeholder="Album"></div>
      <div class="f"><label>MP3 file (max 50 MB)</label><input id="upFile" type="file" accept=".mp3,audio/mpeg"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:13px;margin:12px 0">
        <input type="checkbox" id="upOwn" style="width:auto;margin-top:3px"> I own this music or have permission to share it.
      </label>
      <button class="btn2" id="upBtn">Upload</button>
      <div id="upStatus" style="margin-top:10px;min-height:20px;font-size:13px"></div>
      <div class="home-head" style="margin-top:28px"><h3>My uploads</h3></div>
      <div id="myUploads" class="muted">Loading…</div>`;
    body.querySelector('#upBtn').onclick = uploadSong;
    loadMyUploads();
  }

  async function uploadSong(){
    const status = $('upStatus');
    const say = (msg, ok) => { status.style.color = ok ? 'var(--gold)' : 'var(--danger)'; status.textContent = msg; };
    if (!sb){ say(SETUP_MSG); return; }

    const title = $('upTitle').value.trim();
    const artist = $('upArtist').value.trim() || (state.user && state.user.name) || 'Unknown';
    const album = $('upAlbum').value.trim();
    const file = $('upFile').files[0];
    if (!title) return say('Enter a song title.');
    if (!file) return say('Choose an MP3 file.');
    if (!/\.mp3$/i.test(file.name)) return say('Only MP3 files are allowed.');
    if (file.size > 50 * 1024 * 1024) return say('That file is larger than 50 MB.');
    if (!$('upOwn').checked) return say('Tick the ownership box to continue.');

    const { data: sess } = await sb.auth.getSession();
    const session = sess && sess.session;
    if (!session) return say('Sign in first.');

    const base = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'song';
    const key = Date.now() + '-' + base + '.mp3';

    $('upBtn').disabled = true;
    say('Uploading…', true);
    try {
      const res = await fetch(WORKER_URL + '/upload?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'audio/mpeg' },
        body: file,
      });
      if (!res.ok){ say('Upload failed: ' + (await res.text())); return; }

      const { error } = await sb.from('uploads').insert({
        user_id: session.user.id, title, artist, album,
        file_key: session.user.id + '/' + key,
      });
      if (error){ say('File saved, but it could not be listed: ' + error.message); return; }

      say('Uploaded "' + title + '".', true);
      ['upTitle','upArtist','upAlbum'].forEach(id => $(id).value = '');
      $('upFile').value = '';
      $('upOwn').checked = false;
      loadMyUploads();
    } catch (err) {
      say("Couldn't reach the upload server: " + err.message);
    } finally {
      $('upBtn').disabled = false;
    }
  }

  async function deleteUpload(u){
    if (!sb) return toast(SETUP_MSG, 4000);
    if (!confirm('Delete "' + u.title + '"? This cannot be undone.')) return;
    const { data: sess } = await sb.auth.getSession();
    const session = sess && sess.session;
    if (!session) return toast('Sign in first', 3000);

    const res = await fetch(WORKER_URL + '/delete?key=' + encodeURIComponent(u.file_key), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + session.access_token },
    });
    if (!res.ok) return toast('Delete failed: ' + (await res.text()), 4000);

    const { error } = await sb.from('uploads').delete().eq('id', u.id);
    if (error) return toast('File removed, but the list could not update: ' + error.message, 4000);

    toast('Deleted "' + u.title + '"');
    loadMyUploads();
  }

  async function loadMyUploads(){
    const box = document.getElementById('myUploads');
    if (!box || !sb) return;
    const { data, error } = await sb.from('uploads')
      .select('id, title, artist, album, file_key, created_at')
      .order('created_at', { ascending: false });
    if (error){ box.textContent = 'Could not load: ' + error.message; return; }
    if (!data.length){ box.textContent = 'No uploads yet.'; return; }

    box.innerHTML = '';
    data.forEach((u, i) => {
      const track = {
        id: 'up-' + u.id,
        title: u.title,
        artist: u.artist || 'Unknown',
        album: u.album || 'My uploads',
        genre: 'My uploads',
        art: DEFAULT_ART,
        src: WORKER_URL + '/stream/' + encodeURIComponent(u.file_key),
        duration: 0,
        saved: false,
        license: 'Uploaded by a user',
      };
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="idx">${i + 1}</div>
        <div class="cover-sm"><img src="${DEFAULT_ART}" alt=""></div>
        <div style="min-width:0"><div class="title">${esc(u.title)}</div><div class="artist">${esc(track.artist)}</div></div>
        <div class="album">${esc(track.album)}</div>
        <div class="time"></div>
        <div class="acts"><button class="ibtn-sm" data-act="del" aria-label="Delete"><svg width="13" height="13"><use href="#i-minus"/></svg></button></div>`;
      row.onclick = (e) => {
        if (e.target.closest('[data-act="del"]')){ e.stopPropagation(); deleteUpload(u); return; }
        setQueue([track], 0);
      };
      box.appendChild(row);
    });
  }

  async function loadLibrary(){
    const results = await Promise.allSettled(
      Object.entries(GENRE_TAGS).map(([g, tag]) => fetchTag(g, tag, 20))
    );
    TRACKS = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
    await applyBlocks();
    rebuildIndex();
    if (!TRACKS.length){
      toast("Couldn't load music. Check your internet connection.", 4000);
    } else {
      toast('Loaded ' + TRACKS.length + ' tracks');
    }
    render(); updatePlayer(); renderQueueList();
  }

  let loadingMore = false;
  async function loadMore(genre){
    if (loadingMore) return;
    loadingMore = true;
    toast('Loading more ' + genre + '…');
    try {
      const more = await fetchTag(genre, GENRE_TAGS[genre], 50);
      TRACKS = TRACKS.concat(more);
      rebuildIndex();
      toast(more.length ? 'Added ' + more.length + ' tracks' : 'No more tracks in ' + genre);
      render();
    } catch (err) {
      toast("Couldn't load more. Check your connection.", 4000);
    } finally {
      loadingMore = false;
    }
  }

  // If any cover image fails to load, show the placeholder instead
  document.addEventListener('error', e => {
    if (e.target && e.target.tagName === 'IMG' && e.target.src !== DEFAULT_ART) e.target.src = DEFAULT_ART;
  }, true);

  /* ═══════════ STATE ═══════════ */
  function loadPlaylists(){
    try {
      const saved = JSON.parse(localStorage.getItem('kasi-playlists'));
      if (Array.isArray(saved) && saved.length) return saved;
    } catch (e) {}
    return [{ id: 'p1', name: 'My Mix', tracks: [], public: true }];
  }
  function persist(){
    try {
      localStorage.setItem('kasi-playlists', JSON.stringify(state.playlists));
      // Only save the saved-list once the songs have loaded, so an empty
      // start-up doesn't wipe the user's saved songs.
      if (ALL_TRACKS.length){
        localStorage.setItem('kasi-saved', JSON.stringify(ALL_TRACKS.filter(t => t.saved).map(t => t.id)));
      }
    } catch (e) {}
  }
  function loadSavedIds(){
    try { return new Set(JSON.parse(localStorage.getItem('kasi-saved')) || []); }
    catch (e) { return new Set(); }
  }

  const state = {
    view: 'home',
    user: { name: 'You', email: 'you@kasi.fm' },
    playlists: loadPlaylists(),
    currentPlaylistId: null,
    queue: [], qIndex: -1,
    playing: false, progress: 0,
    shuffle: false, repeat: 'off',
    searchQuery: '', scope: 'all',
    loginMode: 'login',
    studyMin: 25, studySec: 25*60, studyTimer: null,
    artistView: null, // when set, main view shows an artist
  };

  let toastT;
  function toast(msg, ms = 2200){
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
  }

  function go(view, id){
    state.view = view;
    state.currentPlaylistId = id || null;
    state.artistView = null;
    render();
    closeDrawer();
  }

  /* ═══════════ SIDEBAR ═══════════ */
  function renderSidebar(){
    $('savedCount').textContent = ALL_TRACKS.filter(t => t.saved).length;
    $('plCount').textContent = state.playlists.length;
    const genresNav = $('genresNav');
    genresNav.innerHTML = '';
    GENRES.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'nav' + (state.view === g ? ' active' : '');

  /* ═══════════ RENDER ═══════════ */
  function render(){
    persist();
    renderSidebar();
    const body = $('body'), actions = $('pageActions');
    const title = $('pageTitle'), sub = $('pageSub');
    actions.innerHTML = '';

    // HOME
    if (state.view === 'home'){
      title.textContent = 'Home';
      sub.textContent = 'Jump back in';
      renderHome(body);
      return;
    }

    // ARTIST VIEW
    if (state.artistView){
      const artist = state.artistView;
      const tracks = ALL_TRACKS.filter(t => t.artist === artist);
      title.textContent = artist;
      sub.textContent = tracks.length + ' tracks';
      actions.innerHTML = `
        <button class="btn2" id="playArtBtn"><svg width="14" height="14"><use href="#i-play"/></svg> Play</button>
        <button class="btn2 ghost" id="shufArtBtn"><svg width="14" height="14"><use href="#i-shuffle"/></svg> Shuffle</button>`;
      $('playArtBtn').onclick = () => { setQueue(tracks, 0); toast('Playing ' + artist); };
      $('shufArtBtn').onclick = () => { const s = [...tracks].sort(() => Math.random() - 0.5); state.shuffle = true; setQueue(s, 0); toast('Shuffling'); };
      body.innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
          <div style="width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--gray);border:1px solid var(--line);flex-shrink:0">
            <img src="${artistArtURL(artist, 200)}" style="width:100%;height:100%;object-fit:cover;display:block" alt="">
          </div>
          <div>
            <div style="font-size:22px;font-weight:700;letter-spacing:-.3px">${esc(artist)}</div>
            <div style="color:var(--muted);font-size:13px;margin-top:4px">${tracks.length} tracks in Kasi</div>
          </div>
        </div>`;
      renderTrackList(body, tracks, { append: true });
      return;
    }

    // GENRE
    if (GENRES.includes(state.view)){
      title.textContent = state.view;
      const tracks = CATALOG[state.view];
      sub.textContent = tracks.length + ' tracks';
      actions.innerHTML = `
        <button class="btn2" id="playAllBtn"><svg width="14" height="14"><use href="#i-play"/></svg> Play all</button>
        <button class="btn2 ghost" id="shuffleAllBtn"><svg width="14" height="14"><use href="#i-shuffle"/></svg> Shuffle</button>`;
      $('playAllBtn').onclick = () => { setQueue(tracks, 0); toast('Playing all'); };
      $('shuffleAllBtn').onclick = () => { const s = [...tracks].sort(() => Math.random() - 0.5); state.shuffle = true; setQueue(s, 0); toast('Shuffling'); };
      renderTrackList(body, tracks);
      const moreWrap = document.createElement('div');
      moreWrap.style.cssText = 'text-align:center;margin-top:16px';
      moreWrap.innerHTML = '<button class="btn2 ghost" style="flex:none">Load more</button>';
      moreWrap.querySelector('button').onclick = () => loadMore(state.view);
      body.appendChild(moreWrap);
      return;
    }

    if (state.view === 'saved'){
      title.textContent = 'Saved';
      const saved = ALL_TRACKS.filter(t => t.saved);
      sub.textContent = saved.length + ' saved';
      if (!saved.length){ body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">No saved tracks yet.<br>Tap the download icon on any track to save it.</div>'; return; }
      actions.innerHTML = '<button class="btn2 ghost" id="clearSaved">Clear all</button>';
      $('clearSaved').onclick = () => { if (!confirm('Clear all saved tracks?')) return; ALL_TRACKS.forEach(t => t.saved = false); toast('Cleared'); render(); };
      renderTrackList(body, saved);
      return;
    }

    if (state.view === 'playlists'){ title.textContent = 'Playlists'; sub.textContent = state.playlists.length + ' lists'; renderPlaylistGrid(body, state.playlists, true); return; }

    if (state.view === 'playlist'){
      const pl = state.playlists.find(p => p.id === state.currentPlaylistId);
      if (!pl){ state.view = 'home'; return render(); }
      title.textContent = pl.name;
      sub.textContent = pl.tracks.length + ' tracks · ' + (pl.public ? 'public' : 'private');
      actions.innerHTML = `
        <button class="btn2" id="dlAllBtn"><svg width="14" height="14"><use href="#i-download"/></svg> Save all</button>
        <button class="btn2 ghost" id="editPlBtn">Edit</button>`;
      $('dlAllBtn').onclick = () => { pl.tracks.forEach(t => t.saved = true); toast('Downloaded ' + pl.tracks.length + ' tracks'); render(); };
      $('editPlBtn').onclick = () => { const name = prompt('Rename playlist:', pl.name); if (!name?.trim()) return; pl.name = name.trim(); toast('Renamed'); render(); };
      if (!pl.tracks.length){ body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">Empty playlist.</div>'; return; }
      renderTrackList(body, pl.tracks, { playlistId: pl.id });
      return;
    }

    if (state.view === 'explore'){
      title.textContent = 'Explore';
      const publicLists = state.playlists.filter(p => p.public);
      sub.textContent = publicLists.length + ' public playlists';
      renderPlaylistGrid(body, publicLists, false, true);
      return;
    }

    if (state.view === 'people'){
      title.textContent = 'People';
      const people = [
        { name: 'Alex', email: 'alex@kasi.fm', playlists: 5, art: artistArtURL('alex', 100), following: false },
        { name: 'Zara', email: 'zara@kasi.fm', playlists: 2, art: artistArtURL('zara', 100), following: true },
        { name: 'Sam', email: 'sam@kasi.fm', playlists: 2, art: artistArtURL('sam', 100), following: false },
      ];
      sub.textContent = people.length + ' members';
      body.innerHTML = '';
      people.forEach(p => {
        const row = document.createElement('div');
        row.style.cssText = 'display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line)';
        row.innerHTML = `
          <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--gray);border:1px solid var(--line)"><img src="${p.art}" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy" alt=""></div>
          <div><div style="font-weight:600">${esc(p.name)}</div><div style="font-size:12.5px;color:var(--muted)">${p.playlists} playlists · ${esc(p.email)}</div></div>
          <button class="btn2 ${p.following ? 'ghost' : ''}" style="font-size:12px;padding:8px 16px;flex:none">${p.following ? 'Following' : 'Follow'}</button>`;
        const btn = row.querySelector('button');
        btn.onclick = () => { p.following = !p.following; btn.textContent = p.following ? 'Following' : 'Follow'; btn.className = 'btn2 ' + (p.following ? 'ghost' : ''); toast(p.following ? 'Following ' + p.name : 'Unfollowed'); };
        body.appendChild(row);
      });
      return;
    }

    if (state.view === 'admin'){
      if (!state.isAdmin){ go('home'); return; }
      title.textContent = 'Admin';
      sub.textContent = 'Manage the library';
      renderAdmin(body);
      return;
    }
    if (state.view === 'upload'){
      title.textContent = 'Upload';
      sub.textContent = 'Share music you own or have permission to share';
      renderUpload(body);
      return;
    }
    if (state.view === 'feed'){
      title.textContent = 'Feed';
      sub.textContent = 'Recent from people you follow';
      renderPlaylistGrid(body, state.playlists.slice(0, 3), false, true);
      return;
    }
  }

  /* ═══════════ HOME ═══════════ */
  /* ═════════ MAINSTREAM (Deezer, display and link only) ═════════ */
  function deezerSearch(q){
    return new Promise((resolve, reject) => {
      const cb = 'dz' + Date.now() + Math.floor(Math.random() * 1000);
      const script = document.createElement('script');
      const done = () => { delete window[cb]; script.remove(); };
      window[cb] = data => { done(); resolve((data && data.data) || []); };
      script.onerror = () => { done(); reject(new Error('Deezer request failed')); };
      script.src = 'https://api.deezer.com/search?q=' + encodeURIComponent(q) +
        '&limit=20&output=jsonp&callback=' + cb;
      document.body.appendChild(script);
    });
  }

  function renderMainstreamResults(container, items){
    container.innerHTML = '';
    if (!items.length){ container.innerHTML = '<div class="empty">No results.</div>'; return; }
    items.forEach(t => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.cursor = 'default';
      row.innerHTML = `
        <div class="cover-sm"><img src="${esc(t.album && t.album.cover_medium || '')}" loading="lazy" alt=""></div>
        <div style="min-width:0"><div class="title">${esc(t.title)}</div><div class="artist">${esc(t.artist && t.artist.name || '')}</div></div>
        <div></div>
        <a class="btn2 ghost" style="flex:none;text-decoration:none;padding:8px 12px;min-height:34px" href="${esc(t.link || '')}" target="_blank" rel="noopener">Open on Deezer</a>`;
      container.appendChild(row);
    });
  }

  function renderHome(body){
    body.innerHTML = '';

    const mSec = document.createElement('div');
    mSec.className = 'home-section';
    mSec.innerHTML = `
      <div class="home-head"><h3>Mainstream search</h3></div>
      <div class="row" style="cursor:default;grid-template-columns:1fr auto;gap:8px;min-height:0">
        <input id="mainQ" placeholder="Search artists or songs on Deezer" style="padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px;min-width:0">
        <button class="btn2" id="mainBtn" style="flex:none">Search</button>
      </div>
      <div class="muted" style="margin:6px 0 10px">Results come from Deezer. Click "Open on Deezer" to listen there.</div>
      <div id="mainResults"></div>`;
    body.appendChild(mSec);
    const run = async () => {
      const q = mSec.querySelector('#mainQ').value.trim();
      if (!q){ toast('Type a name first'); return; }
      mSec.querySelector('#mainResults').innerHTML = '<div class="empty"><span class="spinner"></span>Searching Deezer…</div>';
      try {
        renderMainstreamResults(mSec.querySelector('#mainResults'), await deezerSearch(q));
      } catch (e) {
        mSec.querySelector('#mainResults').innerHTML = '<div class="empty">Could not reach Deezer. Check your connection.</div>';
      }
    };
    mSec.querySelector('#mainBtn').onclick = run;
    mSec.querySelector('#mainQ').onkeydown = e => { if (e.key === 'Enter') run(); };

    // ═══ PLAY YOUR PLAYLISTS ═══
    const plSection = document.createElement('div');
    plSection.className = 'home-section';
    plSection.innerHTML = `
      <div class="home-head">
        <h3>Your playlists</h3>
        <span class="see-all" id="seeAllPl">See all</span>
      </div>
      <div class="pl-scroller" id="plScroller"></div>`;
    body.appendChild(plSection);
    plSection.querySelector('#seeAllPl').onclick = () => go('playlists');

    const scroller = plSection.querySelector('#plScroller');
    state.playlists.forEach(pl => {
      const coverArt = pl.tracks[0]?.art || artURL('pl-' + pl.id, 200);
      const tile = document.createElement('div');
      tile.className = 'pl-tile';
      tile.innerHTML = `
        <div class="cover">
          <img src="${coverArt}" loading="lazy" alt="">

        </div>
        <h4>${esc(pl.name)}${!pl.public ? ' <span class="pl-badge">Private</span>' : ''}</h4>
        <div class="meta">${pl.tracks.length} track${pl.tracks.length === 1 ? '' : 's'}</div>`;
      tile.onclick = (e) => {
        if (e.target.closest('[data-a="play"]')){
          e.stopPropagation();
          if (!pl.tracks.length){ toast('Playlist is empty'); return; }
          setQueue(pl.tracks, 0);
          toast('Playing "' + pl.name + '"');
          return;
        }
        go('playlist', pl.id);
      };
      scroller.appendChild(tile);
    });

    // ═══ BROWSE GENRES ═══
    const genreSection = document.createElement('div');
    genreSection.className = 'home-section';
    genreSection.innerHTML = `
      <div class="home-head">
        <h3>Browse genres</h3>
      </div>
      <div class="genre-grid" id="genreGrid"></div>`;
    body.appendChild(genreSection);

    const grid = genreSection.querySelector('#genreGrid');
    GENRES.forEach(g => {
      const colors = GENRE_COLORS[g] || ['#8a6a1e', '#4a3010'];
      const sampleArt = CATALOG[g][0]?.art || artURL('genre-' + g, 200);
      const tile = document.createElement('div');
      tile.className = 'genre-tile';
      tile.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;

        <div class="g-count">${CATALOG[g].length} tracks</div>
        <div class="g-art"><img src="${sampleArt}" loading="lazy" alt=""></div>`;
      tile.onclick = () => go(g);
      grid.appendChild(tile);
    });

    // ═══ RECENTLY ADDED (a few random tracks) ═══
    const recentSection = document.createElement('div');
    recentSection.className = 'home-section';
    recentSection.innerHTML = `
      <div class="home-head">
        <h3>Made for you</h3>
      </div>`;
    body.appendChild(recentSection);
    const made = [];
    const seen = new Set();
    while (made.length < Math.min(8, ALL_TRACKS.length)){
      const t = ALL_TRACKS[Math.floor(Math.random() * ALL_TRACKS.length)];
      if (!seen.has(t.id)){ seen.add(t.id); made.push(t); }
    }
    const madeWrap = document.createElement('div');
    recentSection.appendChild(madeWrap);
    renderTrackList(madeWrap, made);
