  /* ═══════════ TRACK LIST ═══════════ */
  function renderTrackList(container, tracks, opts = {}){
    if (!opts.append) container.innerHTML = '';
    tracks.forEach((t, i) => {
      const isPlaying = state.playing && state.queue[state.qIndex]?.id === t.id;
      const row = document.createElement('div');
      row.className = 'row' + (isPlaying ? ' playing' : '');
      row.innerHTML = `
        <div class="idx">${isPlaying ? '▶' : i + 1}</div>
        <div class="cover-sm">${isPlaying ? '<div class="bars"><i></i><i></i><i></i><i></i></div>' : ''}<img src="${t.art}" loading="lazy" alt=""></div>
        <div><div class="title">${esc(t.title)}</div><div class="artist">${esc(t.artist)}</div></div>
        <div class="album">${esc(t.album)}</div>
        <div class="time">${fmt(t.duration)}</div>
        <div class="acts">
          <button class="ibtn-sm ${t.saved ? 'on' : ''}" data-act="save" aria-label="Save"><svg width="13" height="13"><use href="#${t.saved ? 'i-heart-fill' : 'i-heart'}"/></svg></button>
          <button class="ibtn-sm" data-act="dl" aria-label="Download"><svg width="13" height="13"><use href="#i-download"/></svg></button>
          <button class="ibtn-sm" data-act="add"><svg width="13" height="13"><use href="#i-plus"/></svg></button>
          ${opts.playlistId ? '<button class="ibtn-sm danger" data-act="rm"><svg width="13" height="13"><use href="#i-minus"/></svg></button>' : ''}
        </div>`;
      row.onclick = (e) => {
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'save'){ e.stopPropagation(); t.saved = !t.saved; toast(t.saved ? 'Saved "' + t.title + '"' : 'Removed'); render(); return; }
        if (act === 'add'){ e.stopPropagation(); addToPlaylist(t); return; }
        if (act === 'dl'){ e.stopPropagation(); window.open(t.download || t.src, '_blank'); toast('Opening download for "' + t.title + '"', 3000); return; }
        if (act === 'rm'){
          e.stopPropagation();
          const pl = state.playlists.find(p => p.id === opts.playlistId);
          if (!pl) return;
          pl.tracks = pl.tracks.filter(x => x.id !== t.id);
          toast('Removed'); render(); return;
        }
        setQueue(tracks, i);
      };
      container.appendChild(row);
    });
  }

  function renderPlaylistGrid(container, lists, mine, forkable){
    container.innerHTML = '';
    if (!lists.length){ container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">No playlists here.</div>'; return; }
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px';
    lists.forEach(pl => {
      const coverArt = pl.tracks[0]?.art || artURL('pl-' + pl.id, 200);
      const tile = document.createElement('div');
      tile.className = 'pl-tile';
      tile.style.width = 'auto';
      tile.innerHTML = `
        <div class="cover">
          <img src="${coverArt}" loading="lazy" alt="">
          <button class="pl-play" data-a="play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button>
        </div>
        <h4>${esc(pl.name)}${!pl.public ? ' <span class="pl-badge">Private</span>' : ''}</h4>
        <div class="meta">${pl.tracks.length} tracks${forkable ? '' : ''}</div>
        ${forkable || mine ? `<div style="display:flex;gap:6px;margin-top:10px">
          ${forkable ? '<button class="ibtn-sm" data-a="fork" title="Fork"><svg width="13" height="13"><use href="#i-plus"/></svg></button>' : ''}
          ${mine ? '<button class="ibtn-sm danger" data-a="del" title="Delete"><svg width="13" height="13"><use href="#i-minus"/></svg></button>' : ''}
        </div>` : ''}`;
      tile.onclick = (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (a === 'play'){
          e.stopPropagation();
          if (!pl.tracks.length){ toast('Playlist is empty'); return; }
          setQueue(pl.tracks, 0);
          toast('Playing "' + pl.name + '"');
          return;
        }
        if (a === 'fork'){
          e.stopPropagation();
          state.playlists.push({ id: 'p' + Date.now(), name: pl.name + ' (forked)', tracks: [...pl.tracks], public: true });
          toast('Forked "' + pl.name + '"'); render(); return;
        }
        if (a === 'del'){
          e.stopPropagation();
          if (!confirm('Delete "' + pl.name + '"?')) return;
          state.playlists = state.playlists.filter(x => x.id !== pl.id);
          toast('Deleted'); render(); return;
        }
        go('playlist', pl.id);
      };
      grid.appendChild(tile);
    });
    container.appendChild(grid);
  }

  function addToPlaylist(t){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;display:flex;align-items:flex-end;justify-content:center;padding:16px';
    const box = document.createElement('div');
    box.style.cssText = 'width:100%;max-width:420px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px;max-height:80vh;overflow-y:auto';
    box.innerHTML = '<div style="font-weight:700;margin-bottom:4px">Add to playlist</div>' +
      '<div style="color:var(--muted);font-size:12.5px;margin-bottom:14px">' + esc(t.title) + '</div>';

    const close = () => overlay.remove();
    const addTo = (pl) => {
      if (pl.tracks.some(x => x.id === t.id)){ toast('Already in "' + pl.name + '"'); close(); return; }
      pl.tracks.push(t);
      toast('Added to "' + pl.name + '"');
      close();
      render();
    };

    state.playlists.forEach(pl => {
      const b = document.createElement('button');
      b.className = 'nav';
      b.style.marginBottom = '6px';
      b.textContent = pl.name + ' (' + pl.tracks.length + ')';
      b.onclick = () => addTo(pl);
      box.appendChild(b);
    });

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:12px';
    row.innerHTML = '<input placeholder="New playlist name" style="flex:1;min-width:0;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px">' +
      '<button class="btn2" style="flex:none">Create</button>';
    row.querySelector('button').onclick = () => {
      const name = row.querySelector('input').value.trim();
      if (!name){ toast('Type a name first'); return; }
      const pl = { id: 'p' + Date.now(), name: name, tracks: [], public: true };
      state.playlists.push(pl);
      addTo(pl);
    };
    box.appendChild(row);

    const cancel = document.createElement('button');
    cancel.className = 'nav';
    cancel.style.marginTop = '8px';
    cancel.textContent = 'Cancel';
    cancel.onclick = close;
    box.appendChild(cancel);

    overlay.appendChild(box);
    overlay.onclick = e => { if (e.target === overlay) close(); };
    document.body.appendChild(overlay);
  }

  /* ═══════════ PLAYBACK ═══════════ */
  function setQueue(tracks, idx){
    state.queue = [...tracks]; state.qIndex = idx;
    state.playing = true; state.progress = 0;
    syncAudio();
    updatePlayer(); render(); renderQueueList(); renderMoreFromArtist();
  }

  function syncAudio(){
    const t = state.queue[state.qIndex];
    if (!t){ Audio.stop(); return; }
    if (state.playing){ Audio.load(t); Audio.start(); $('liveBadge').classList.add('on'); }
    else { Audio.stop(); $('liveBadge').classList.remove('on'); }
  }

  function updatePlayer(){
    const t = state.queue[state.qIndex];
    const title = t ? t.title : 'Nothing playing';
    const artist = t ? t.artist : 'Tap a track';

    $('npTitle').textContent = title;
    $('npArtist').textContent = artist;
    $('miniArt').innerHTML = t ? `<img src="${t.art}" alt="">` : '';
    $('miniPlay').innerHTML = `<svg width="16" height="16"><use href="#${state.playing ? 'i-pause' : 'i-play'}"/></svg>`;
    $('playD').innerHTML = `<svg width="16" height="16"><use href="#${state.playing ? 'i-pause' : 'i-play'}"/></svg>`;
    $('npArt').innerHTML = t ? `<img src="${t.art.replace('/200/200','/400/400')}" alt="">` : '';
    $('npT').textContent = title;
    $('npA').textContent = artist;
    $('npLic').textContent = t && t.license ? 'License: ' + t.license : '';
    $('npPlay').innerHTML = `<svg width="24" height="24"><use href="#${state.playing ? 'i-pause' : 'i-play'}"/></svg>`;
    $('npSave').innerHTML = `<svg width="18" height="18"><use href="#${t?.saved ? 'i-heart-fill' : 'i-heart'}"/></svg>`;
    $('npSave').classList.toggle('on', !!t?.saved);
    $('npShuf').classList.toggle('on', state.shuffle);
    $('npRep').classList.toggle('on', state.repeat !== 'off');
    $('shufBtn').classList.toggle('on', state.shuffle);
    $('repBtn').classList.toggle('on', state.repeat !== 'off');
    $('dur').textContent = t ? fmt(t.duration) : '0:00';
    $('npDur').textContent = t ? fmt(t.duration) : '0:00';
    $('studyTrk').textContent = t ? t.title : '—';
    $('studyArt').textContent = t ? t.artist : '';
    $('studyPlay').innerHTML = `<svg width="22" height="22"><use href="#${state.playing ? 'i-pause' : 'i-play'}"/></svg>`;

    if (t){ $('miniProgress').firstElementChild.style.width = Math.min(100, (state.progress / t.duration) * 100) + '%'; }
    else { $('miniProgress').firstElementChild.style.width = '0%'; }
  }

  function tick(){
    if (!state.playing) return;
    const t = state.queue[state.qIndex]; if (!t) return;
    state.progress = Audio.el.currentTime;
    const pct = t.duration ? Math.round((state.progress / t.duration) * 1000) : 0;
    $('seek').value = pct; $('npSeek').value = pct;
    $('cur').textContent = fmt(state.progress);
    $('npCur').textContent = fmt(state.progress);
    $('miniProgress').firstElementChild.style.width = Math.min(100, (state.progress / t.duration) * 100) + '%';
  }
  setInterval(tick, 1000);

  function nextTrack(auto){
    if (!state.queue.length) return;
    if (state.repeat === 'one' && auto){ Audio.el.currentTime = 0; Audio.start(); return; }
    if (state.shuffle){
      let n;
      do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.qIndex && state.queue.length > 1);
      state.qIndex = n;
    } else {
      if (state.qIndex === state.queue.length - 1 && state.repeat === 'off'){ state.playing = false; syncAudio(); updatePlayer(); render(); return; }
      state.qIndex = (state.qIndex + 1) % state.queue.length;
    }
    state.progress = 0; state.playing = true;
    syncAudio(); updatePlayer(); render(); renderQueueList(); renderMoreFromArtist();
  }
  function prevTrack(){
    if (!state.queue.length) return;
    if (state.progress > 3){ state.progress = 0; updatePlayer(); return; }
    state.qIndex = (state.qIndex - 1 + state.queue.length) % state.queue.length;
    state.progress = 0; state.playing = true;
    syncAudio(); updatePlayer(); render(); renderQueueList(); renderMoreFromArtist();
  }

  /* ═══════════ MORE FROM ARTIST ═══════════ */
  function renderMoreFromArtist(){
    const container = $('moreArtist');
    const current = state.queue[state.qIndex];
    if (!current){ container.innerHTML = ''; return; }
    const more = ALL_TRACKS.filter(t => t.artist === current.artist && t.id !== current.id);
    const seen = new Set(); const unique = [];
    for (const t of more){ if (!seen.has(t.id)){ seen.add(t.id); unique.push(t); } }
    const slice = unique.slice(0, 5);
    container.innerHTML = `
      <div class="mh"><h4>More from</h4><span>${slice.length} track${slice.length === 1 ? '' : 's'}</span></div>
      <div class="artist-chip">
        <img src="${artistArtURL(current.artist, 100)}" alt="" loading="lazy">
        <div><div class="an">${esc(current.artist)}</div><div class="as">${unique.length + 1} tracks in Kasi</div></div>
      </div>
      <div id="moreRows"></div>`;
    const rowsWrap = container.querySelector('#moreRows');
    slice.forEach(t => {
      const isPlaying = state.playing && state.queue[state.qIndex]?.id === t.id;
      const row = document.createElement('div');
      row.className = 'more-row' + (isPlaying ? ' playing' : '');
      row.innerHTML = `
        <div class="mr-cover"><img src="${t.art}" loading="lazy" alt=""></div>
        <div><div class="mr-title">${esc(t.title)}</div><div class="mr-sub">${esc(t.album)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mr-dur">${fmt(t.duration)}</span>
          <span class="mr-play"><svg width="12" height="12"><use href="#i-play"/></svg></span>
        </div>`;
      row.onclick = () => {
        state.queue = [t, ...state.queue.filter(x => x.id !== t.id)];
        state.qIndex = 0;
        state.progress = 0; state.playing = true;
        syncAudio(); updatePlayer(); renderQueueList(); renderMoreFromArtist();
        toast('Playing "' + t.title + '"');
      };
      rowsWrap.appendChild(row);
    });
    if (!slice.length){ rowsWrap.innerHTML = '<div style="padding:14px 6px;color:var(--muted);font-size:12.5px">No other tracks from this artist.</div>'; }
  }

  /* ═══════════ QUEUE ═══════════ */
  function renderQueueList(){
    const list = $('qList'); list.innerHTML = '';
    if (!state.queue.length){ list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Queue is empty.</div>'; return; }
    state.queue.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'q-item' + (i === state.qIndex ? ' current' : '');
      el.innerHTML = `
        <div class="q-num">${i === state.qIndex ? '▶' : i + 1}</div>
        <div class="q-thumb"><img src="${t.art}" loading="lazy" alt=""></div>
        <div><div class="q-t">${esc(t.title)}</div><div class="q-a">${esc(t.artist)}</div></div>`;
      el.onclick = () => { state.qIndex = i; state.progress = 0; state.playing = true; syncAudio(); updatePlayer(); render(); renderQueueList(); renderMoreFromArtist(); };
      list.appendChild(el);
    });
  }

  /* ═══════════ CONTROLS ═══════════ */
  /* ═════════ SLEEP TIMER ═════════ */
  const SLEEP_STEPS = [0, 15, 30, 60];
  let sleepStep = 0, sleepTimeout = null, sleepRefresh = null, sleepEnd = 0;

  function updateSleepBtn(){
    const b = $('npSleep');
    if (!sleepEnd){
      b.textContent = 'Sleep';
      b.style.color = '';
      b.style.borderColor = 'var(--line)';
      return;
    }
    const mins = Math.max(1, Math.ceil((sleepEnd - Date.now()) / 60000));
    b.textContent = 'Sleep ' + mins + 'm';
    b.style.color = 'var(--gold)';
    b.style.borderColor = 'var(--gold)';
  }

  function clearSleep(){
    clearTimeout(sleepTimeout);
    clearInterval(sleepRefresh);
    sleepTimeout = null; sleepRefresh = null; sleepEnd = 0;
  }

  function setSleep(minutes){
    clearSleep();
    if (!minutes){ updateSleepBtn(); toast('Sleep timer off'); return; }
    sleepEnd = Date.now() + minutes * 60000;
    sleepTimeout = setTimeout(() => {
      clearSleep();
      state.playing = false;
      syncAudio(); updatePlayer(); render();
      updateSleepBtn();
      toast('Sleep timer ended. Music stopped.', 4000);
    }, minutes * 60000);
    sleepRefresh = setInterval(updateSleepBtn, 30000);
    updateSleepBtn();
    toast('Music will stop in ' + minutes + ' minutes', 3000);
  }

  $('npSleep').onclick = () => {
    sleepStep = (sleepStep + 1) % SLEEP_STEPS.length;
    setSleep(SLEEP_STEPS[sleepStep]);
  };

  $('miniPlay').onclick = e => { e.stopPropagation(); if (!state.queue.length){ toast('Pick a track first'); return; } state.playing = !state.playing; syncAudio(); updatePlayer(); render(); };
  $('playD').onclick = () => { if (!state.queue.length){ toast('Pick a track first'); return; } state.playing = !state.playing; syncAudio(); updatePlayer(); render(); };
  $('nextBtn').onclick = () => nextTrack(false);
  $('prevBtn').onclick = prevTrack;
  $('npPlay').onclick = () => { if (!state.queue.length){ toast('Pick a track first'); return; } state.playing = !state.playing; syncAudio(); updatePlayer(); render(); };
  $('npNext').onclick = () => nextTrack(false);
  $('npPrev').onclick = prevTrack;
  $('shufBtn').onclick = () => { state.shuffle = !state.shuffle; toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); updatePlayer(); };
  $('npShuf').onclick = () => { state.shuffle = !state.shuffle; toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); updatePlayer(); };
  $('repBtn').onclick = () => { state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off'; toast('Repeat ' + state.repeat); updatePlayer(); };
  $('npRep').onclick = () => { state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off'; toast('Repeat ' + state.repeat); updatePlayer(); };
  $('npSave').onclick = () => { const t = state.queue[state.qIndex]; if (!t){ toast('Nothing playing'); return; } t.saved = !t.saved; toast(t.saved ? 'Saved' : 'Removed'); updatePlayer(); render(); };
  $('seek').oninput = e => { const t = state.queue[state.qIndex]; if (!t) return; Audio.el.currentTime = (Number(e.target.value) / 1000) * (Audio.el.duration || 0); state.progress = Audio.el.currentTime; updatePlayer(); };
  $('npSeek').oninput = e => { const t = state.queue[state.qIndex]; if (!t) return; Audio.el.currentTime = (Number(e.target.value) / 1000) * (Audio.el.duration || 0); state.progress = Audio.el.currentTime; $('cur').textContent = fmt(state.progress); $('npCur').textContent = fmt(state.progress); };
  $('vol').oninput = e => Audio.setVolume(Number(e.target.value) / 100);

  $('miniPlayer').onclick = (e) => {
    if (e.target.closest('#miniPlay')) return;
    if (!state.queue.length){ toast('Pick a track first'); return; }
    $('npscreen').classList.add('open');
    updatePlayer(); renderMoreFromArtist();
  };

  $('npA').onclick = () => {
    const t = state.queue[state.qIndex];
    if (!t) return;
    $('npscreen').classList.remove('open');
    state.view = null; state.artistView = t.artist; state.currentPlaylistId = null;
    render();
    toast('Showing ' + t.artist);
  };

  $('npClose').onclick = () => $('npscreen').classList.remove('open');
  $('queueBtn').onclick = () => { renderQueueList(); $('queue').classList.add('open'); };
  $('npQueue').onclick = () => { $('npscreen').classList.remove('open'); renderQueueList(); $('queue').classList.add('open'); };
  $('qClose').onclick = () => $('queue').classList.remove('open');

  const drawer = $('drawer'), backdrop = $('backdrop');
  function openDrawer(){ drawer.classList.add('open'); backdrop.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  $('hamb').onclick = openDrawer;
  backdrop.onclick = closeDrawer;

  document.querySelectorAll('#tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const t = b.dataset.tab;
      if (t === 'home') go('home');
      if (t === 'search') $('search').focus();
      if (t === 'saved') go('saved');
      if (t === 'playlists') go('playlists');
      if (t === 'you') go('people');
    };
  });

  /* ═══════════ SEARCH ═══════════ */
  let searchT;
  $('search').oninput = e => {
    clearTimeout(searchT);
    state.searchQuery = e.target.value.trim();
    searchT = setTimeout(() => { if (!state.searchQuery){ if (state.view === null) { state.view = 'home'; state.artistView = null; } render(); return; } runSearch(); }, 200);
  };
  $('scope').onchange = e => { state.scope = e.target.value; if (state.searchQuery) runSearch(); };

  function runSearch(){
    const q = state.searchQuery.toLowerCase();
    let results = ALL_TRACKS.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) || t.album.toLowerCase().includes(q));
    if (state.scope === 'saved') results = results.filter(t => t.saved);
    const seen = new Set();
    results = results.filter(t => seen.has(t.id) ? false : (seen.add(t.id), true));
    $('pageTitle').textContent = 'Results for "' + state.searchQuery + '"';
    $('pageSub').textContent = results.length + ' tracks';
    $('pageActions').innerHTML = '';
    state.view = null; state.artistView = null;
    const body = $('body');
    if (!results.length){ body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">No matches.</div>'; return; }
    renderTrackList(body, results.slice(0, 40));
  }

  /* ═══════════ STUDY ═══════════ */
  function openStudy(){ $('study').classList.add('open'); if (!state.queue.length && ALL_TRACKS.length) setQueue(ALL_TRACKS, 0); startStudyTimer(); }
  function closeStudy(){ $('study').classList.remove('open'); clearInterval(state.studyTimer); }
  function startStudyTimer(){
    clearInterval(state.studyTimer);
    state.studySec = state.studyMin * 60;
    updateStudyTimer();
    state.studyTimer = setInterval(() => {
      state.studySec--;
      if (state.studySec <= 0){ clearInterval(state.studyTimer); toast('Session complete. Take a break.', 5000); state.playing = false; syncAudio(); updatePlayer(); return; }
      updateStudyTimer();
    }, 1000);
  }
  function updateStudyTimer(){
    const m = Math.floor(state.studySec / 60);
    const s = state.studySec % 60;
    $('studyTimer').textContent = m + ':' + String(s).padStart(2, '0');
    const total = state.studyMin * 60;
    const pct = 1 - state.studySec / total;
    $('studyLbl').textContent = pct > 0.85 ? 'Final stretch' : pct > 0.5 ? 'Almost there' : 'Focus session';
  }
  $('studyBtn').onclick = openStudy;
  $('adminBtn').onclick = () => go('admin');
  $('uploadBtn').onclick = () => go('upload');
  $('studyExit').onclick = closeStudy;
  $('studyPlay').onclick = () => { state.playing = !state.playing; syncAudio(); updatePlayer(); };
  $('studyNext').onclick = () => nextTrack(false);
  $('studyPrev').onclick = prevTrack;
  document.querySelectorAll('.study-dur button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.study-dur button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      state.studyMin = Number(b.dataset.min);
      startStudyTimer();
    };
  });

  /* ═══════════ LOGIN (Supabase) ═══════════ */
  // Paste your project values from Supabase: Project Settings → API.
  // Use the "anon" public key only. Never put the "service_role" key in this file.
  const SUPABASE_URL = "https://afrkxklisapgtbquzmxc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_BS7YSURpnll3JWJJJH2pqg_xvP8rYas";
  const SETUP_MSG = 'Add your Supabase URL and key in index.html, and check your internet connection.';
  const sbReady = typeof supabase !== 'undefined' && !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR_ANON_KEY');
  const sb = sbReady ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  if (!sb) console.warn(SETUP_MSG);

  let authMode = 'login';
  // Basic format check. The real proof of ownership is Supabase's confirmation email.
  const isRealEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
  const MODE_TEXT = {
    login:    { sub: 'Welcome back', btn: 'Log in', switch: 'No account?', switchBtn: 'Sign up' },
    register: { sub: 'Create your account', btn: 'Create account', switch: 'Have an account?', switchBtn: 'Log in' },
    forgot:   { sub: 'We will email you a reset link', btn: 'Send reset link', switch: 'Remembered it?', switchBtn: 'Back to log in' },
    reset:    { sub: 'Choose a new password', btn: 'Save new password', switch: '', switchBtn: '' },
  };

  function setAuthMode(mode){
    authMode = mode;
    const t = MODE_TEXT[mode];
    $('loginSub').textContent = t.sub;
    $('loginBtn').textContent = t.btn;
    $('switchTxt').textContent = t.switch;
    $('switchBtn').textContent = t.switchBtn;
    $('switchTxt').style.display = t.switch ? '' : 'none';
    $('switchBtn').style.display = t.switchBtn ? '' : 'none';
    $('nameField').style.display = mode === 'register' ? 'block' : 'none';
    $('inEmail').parentElement.style.display = mode === 'reset' ? 'none' : '';
    $('inPass').parentElement.style.display = mode === 'forgot' ? 'none' : '';
    $('forgotBtn').style.display = mode === 'login' ? '' : 'none';
    $('loginErr').textContent = '';
  }

  function showError(msg){ $('loginErr').style.color = 'var(--danger)'; $('loginErr').textContent = msg; }
  function showInfo(msg){ $('loginErr').style.color = 'var(--gold)'; $('loginErr').textContent = msg; }

  function enterApp(user){
    const name = (user.user_metadata && user.user_metadata.name) || user.email.split('@')[0];
    state.user = { name, email: user.email };
    $('who').textContent = name;
    $('whoD').textContent = name;
    $('login').classList.add('off');
    checkAdmin();
  }

  if (sb) sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY'){
      $('login').classList.remove('off');
      setAuthMode('reset');
      return;
    }
    if (session && session.user) enterApp(session.user);
  });

  $('switchBtn').onclick = () => {
    setAuthMode(authMode === 'login' ? 'register' : 'login');
  };
  $('forgotBtn').onclick = () => setAuthMode('forgot');

  $('loginBtn').onclick = async () => {
    if (!sb){ showError(SETUP_MSG); return; }
    const email = $('inEmail').value.trim();
    const pass = $('inPass').value;
    const name = $('inName').value.trim();
    $('loginBtn').disabled = true;
    try {
      if (authMode === 'forgot'){
        if (!isRealEmail(email)) return showError('Enter a valid email address');
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
        if (error) return showError(error.message);
        return showInfo('Check your email for a reset link.');
      }
      if (authMode === 'reset'){
        if (pass.length < 8) return showError('Password must be 8+ characters');
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) return showError(error.message);
        const { data } = await sb.auth.getUser();
        if (data.user){ enterApp(data.user); toast('Password updated'); }
        return;
      }
      if (!isRealEmail(email)) return showError('Enter a valid email address');
      if (pass.length < 8) return showError('Password must be 8+ characters');

      if (authMode === 'register'){
        if (!name) return showError('Name required');
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
        if (error) return showError(error.message);
        if (data.session) return enterApp(data.user);
        return showInfo('Account created. Check your email to confirm, then log in.');
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) return showError(error.message);
      enterApp(data.user);
    } finally {
      $('loginBtn').disabled = false;
    }
  };

  $('logoutBtn').onclick = async () => {
    if (!confirm('Log out?')) return;
    state.playing = false; syncAudio();
    if (sb) await sb.auth.signOut();
    state.isAdmin = false; state.view = 'home';
    $('adminBtn').style.display = 'none';
    setAuthMode('login');
    $('login').classList.remove('off');
    toast('Logged out');
  };
  $('inPass').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };

  document.onkeydown = e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space'){ e.preventDefault(); $('playD').click(); }
    if (e.code === 'ArrowRight' && e.shiftKey) nextTrack(false);
    if (e.code === 'ArrowLeft' && e.shiftKey) prevTrack();
  };

  ALL_TRACKS.slice(0, 1).forEach(t => t.saved = true);

  setAuthMode('login');
  render();
  updatePlayer();
  renderQueueList();
  loadLibrary();
})();
</script>
</body>
</html>
